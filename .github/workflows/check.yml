name: Comprobar trenes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: comprobar-trenes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El estado (qué trenes ya se avisaron) se guarda entre ejecuciones en la caché de Actions.
      - uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Comprobar Renfe
        run: node check.mjs
        env:
          TRENES: ${{ vars.TRENES }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .estado
          key: estado-${{ github.run_id }}

      # GitHub pausa las rutinas si el repo pasa 60 días sin commits.
      # Si el último commit tiene más de 30 días, hace uno mínimo para mantenerlo activo.
      - name: Mantener activa la rutina
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 30 * 24 * 3600 )) ]; then
            date -u +%F > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Mantener activa la rutina"
            git push
          else
            echo "Último commit reciente, no hace falta nada."
          fi
